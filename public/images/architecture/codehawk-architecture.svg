<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 852" width="1000" height="852" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ch-title ch-desc">
  <title id="ch-title">CodeHawk pipeline architecture</title>
  <desc id="ch-desc">A CI trigger feeds a deterministic prepare stage, then a per-batch agent phase that produces findings.json, then a deterministic posting engine that comments on the pull request and gates the build.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a929e"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b3bac4"/>
    </marker>
    <style>
      .band  { fill:#f5f6f8; stroke:#e3e6ea; stroke-width:1; }
      .blab  { fill:#7c848f; font-size:11px; font-weight:700; letter-spacing:1.4px; }
      .box   { fill:#ffffff; stroke:#ccd2da; stroke-width:1.2; }
      .llm   { fill:#fdf4ef; stroke:#c2603a; stroke-width:1.4; }
      .store { fill:#eef1f5; stroke:#aab3c0; stroke-width:1.2; }
      .side  { fill:#ffffff; stroke:#c3cad3; stroke-width:1.2; stroke-dasharray:5 4; }
      .t     { fill:#23272e; font-size:13px; font-weight:650; }
      .s     { fill:#6d757f; font-size:10.5px; }
      .flow  { stroke:#8a929e; stroke-width:1.6; fill:none; marker-end:url(#arw); }
      .read  { stroke:#b3bac4; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arwd); }
      .lg    { fill:#6d757f; font-size:11px; }
    </style>
  </defs>

  <!-- ── Trigger row ─────────────────────────────────────────── -->
  <rect class="box" x="40" y="24" width="300" height="52" rx="7"/>
  <text class="t" x="58" y="47">CI trigger</text>
  <text class="s" x="58" y="63">Azure Pipelines or GitHub Actions → docker run</text>

  <rect class="side" x="640" y="24" width="320" height="52" rx="7"/>
  <text class="t" x="658" y="47">Repo-level controls</text>
  <text class="s" x="658" y="63">.codereview.md conventions · .codereview.yml thresholds</text>

  <!-- ── Band 1: prepare ─────────────────────────────────────── -->
  <rect class="band" x="40" y="96" width="920" height="124" rx="10"/>
  <text class="blab" x="60" y="118">PREPARE · DETERMINISTIC</text>

  <rect class="box" x="60" y="130" width="205" height="72" rx="6"/>
  <text class="t" x="76" y="153">Fetch PR once</text>
  <text class="s" x="76" y="170">Metadata, file list, commit</text>
  <text class="s" x="76" y="185">SHAs; non-code files dropped</text>

  <rect class="box" x="285" y="130" width="205" height="72" rx="6"/>
  <text class="t" x="301" y="153">Pick review mode</text>
  <text class="s" x="301" y="170">Prior findings present?</text>
  <text class="s" x="301" y="185">Full · Verify-fixes · Check-new</text>

  <rect class="box" x="510" y="130" width="205" height="72" rx="6"/>
  <text class="t" x="526" y="153">Build AST graph</text>
  <text class="s" x="526" y="170">Optional. Blast radius,</text>
  <text class="s" x="526" y="185">callers, dependents, test gaps</text>

  <rect class="box" x="735" y="130" width="205" height="72" rx="6"/>
  <text class="t" x="751" y="153">Score risk, split work</text>
  <text class="s" x="751" y="170">High / medium / low per file;</text>
  <text class="s" x="751" y="185">batches of 10 files</text>

  <path class="flow" d="M 190 76 L 190 122"/>
  <path class="read" d="M 960 50 L 982 50 L 982 300 L 966 300"/>
  <path class="read" d="M 982 300 L 982 653 L 946 653"/>

  <!-- ── Band 2: agent ───────────────────────────────────────── -->
  <rect class="band" x="40" y="240" width="920" height="222" rx="10"/>
  <text class="blab" x="60" y="262">PHASE 1 · AGENT — RUNS PER BATCH, UP TO 3 IN PARALLEL</text>

  <rect class="llm" x="60" y="274" width="205" height="76" rx="6"/>
  <text class="t" x="76" y="297">Pass 1A · scan</text>
  <text class="s" x="76" y="314">One call, no tools. Correctness,</text>
  <text class="s" x="76" y="329">error handling, tests, style.</text>
  <text class="s" x="76" y="344">Diffs pre-injected.</text>

  <rect class="llm" x="285" y="274" width="205" height="76" rx="6"/>
  <text class="t" x="301" y="297">Pass 1B · deep scan</text>
  <text class="s" x="301" y="314">One call, no tools. Security,</text>
  <text class="s" x="301" y="329">performance, architecture.</text>
  <text class="s" x="301" y="344">Same diffs, different lens.</text>

  <rect class="box" x="510" y="274" width="205" height="76" rx="6"/>
  <text class="t" x="526" y="297">Merge candidates</text>
  <text class="s" x="526" y="314">Deduplicated by</text>
  <text class="s" x="526" y="329">file + line + category</text>

  <rect class="llm" x="735" y="274" width="205" height="76" rx="6"/>
  <text class="t" x="751" y="297">Pass 2 · verify</text>
  <text class="s" x="751" y="314">Short multi-turn loop with tools.</text>
  <text class="s" x="751" y="329">Drops false positives, adds</text>
  <text class="s" x="751" y="344">line-level fix suggestions.</text>

  <rect class="side" x="510" y="378" width="430" height="66" rx="6"/>
  <text class="t" x="526" y="400">Tools available to pass 2</text>
  <text class="s" x="526" y="417">VCS: get_pr · get_file_content · get_file_diff · list_threads</text>
  <text class="s" x="526" y="432">Workspace: read_local_file · search_code · git_blame  |  Graph: blast radius, callers</text>

  <path class="flow" d="M 265 312 L 281 312"/>
  <path class="flow" d="M 490 312 L 506 312"/>
  <path class="flow" d="M 715 312 L 731 312"/>
  <path class="read" d="M 837 378 L 837 356"/>

  <!-- ── Artifact ────────────────────────────────────────────── -->
  <rect class="store" x="385" y="486" width="230" height="52" rx="6"/>
  <text class="t" x="403" y="509">findings.json</text>
  <text class="s" x="403" y="525">The only handoff between phases</text>

  <path class="flow" d="M 500 462 L 500 482"/>
  <path class="flow" d="M 500 538 L 500 562"/>

  <!-- ── Band 3: poster ──────────────────────────────────────── -->
  <rect class="band" x="40" y="580" width="920" height="130" rx="10"/>
  <text class="blab" x="60" y="602">PHASE 2 · DETERMINISTIC ENGINE — NO MODEL CALLS ON THE MAIN PATH</text>

  <rect class="box" x="60" y="614" width="205" height="78" rx="6"/>
  <text class="t" x="76" y="637">Validate and filter</text>
  <text class="s" x="76" y="654">Schema check, confidence</text>
  <text class="s" x="76" y="669">floor, cap of 5 comments</text>
  <text class="s" x="76" y="684">per file</text>

  <rect class="box" x="285" y="614" width="205" height="78" rx="6"/>
  <text class="t" x="301" y="637">Deduplicate</text>
  <text class="s" x="301" y="654">cr-id = SHA1 of</text>
  <text class="s" x="301" y="669">file:line:category, read back</text>
  <text class="s" x="301" y="684">from existing threads</text>

  <rect class="box" x="510" y="614" width="205" height="78" rx="6"/>
  <text class="t" x="526" y="637">Score</text>
  <text class="s" x="526" y="654">Penalty matrix over category</text>
  <text class="s" x="526" y="669">× severity, mode multipliers,</text>
  <text class="s" x="526" y="684">0–5 stars</text>

  <rect class="box" x="735" y="614" width="205" height="78" rx="6"/>
  <text class="t" x="751" y="637">Post and gate</text>
  <text class="s" x="751" y="654">Inline comments, PR summary,</text>
  <text class="s" x="751" y="669">thread resolution on re-push</text>

  <path class="flow" d="M 265 653 L 281 653"/>
  <path class="flow" d="M 490 653 L 506 653"/>
  <path class="flow" d="M 715 653 L 731 653"/>

  <!-- ── Outputs ─────────────────────────────────────────────── -->
  <rect class="box" x="285" y="730" width="290" height="48" rx="6"/>
  <text class="t" x="303" y="751">Azure DevOps / GitHub</text>
  <text class="s" x="303" y="767">Inline comments and PR summary</text>

  <rect class="box" x="605" y="730" width="290" height="48" rx="6"/>
  <text class="t" x="623" y="751">CI gate</text>
  <text class="s" x="623" y="767">Structured JSON result, pass or fail</text>

  <path class="flow" d="M 430 710 L 430 726"/>
  <path class="flow" d="M 750 710 L 750 726"/>

  <!-- ── Legend ──────────────────────────────────────────────── -->
  <rect x="40" y="800" width="920" height="38" rx="6" fill="none" stroke="#e3e6ea"/>
  <rect x="60" y="813" width="16" height="12" rx="2" class="llm"/>
  <text class="lg" x="84" y="823">model call</text>
  <rect x="188" y="813" width="16" height="12" rx="2" class="box"/>
  <text class="lg" x="212" y="823">deterministic step</text>
  <rect x="356" y="813" width="16" height="12" rx="2" class="store"/>
  <text class="lg" x="380" y="823">artifact on disk</text>
  <path class="flow" d="M 512 819 L 546 819"/>
  <text class="lg" x="554" y="823">pipeline flow</text>
  <path class="read" d="M 672 819 L 706 819"/>
  <text class="lg" x="714" y="823">read path / configuration</text>
</svg>
