<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-label="MooPin layout pipeline: initialisation, layout pass, and re-entry triggers">
  <style>
    svg { --accent: #0f6d8c; --ink: #12161c; --muted: #5d6570; --line: #9aa3ae; --band: #f3f5f7; --band-line: #dde2e8; --panel: #ffffff; }
    .band      { fill: var(--band); stroke: var(--band-line); stroke-width: 1; rx: 6; }
    .bandlabel { font: 600 11px/1 ui-sans-serif, "Helvetica Neue", Arial, sans-serif; fill: var(--muted); letter-spacing: .09em; text-transform: uppercase; }
    .box       { fill: var(--panel); stroke: var(--line); stroke-width: 1.25; rx: 4; }
    .box-key   { fill: var(--panel); stroke: var(--accent); stroke-width: 2.25; rx: 4; }
    .loop      { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 5 4; rx: 5; }
    .looplabel { font: 600 10.5px/1 ui-sans-serif, Arial, sans-serif; fill: var(--muted); letter-spacing: .06em; }
    .t         { font: 600 13px/1 ui-sans-serif, "Helvetica Neue", Arial, sans-serif; fill: var(--ink); }
    .t-key     { font: 600 13px/1 ui-sans-serif, "Helvetica Neue", Arial, sans-serif; fill: var(--accent); }
    .c         { font: 400 10.5px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--muted); }
    .caption   { font: 600 12.5px/1 ui-sans-serif, Arial, sans-serif; fill: var(--ink); letter-spacing: .02em; }
    .note      { font: 400 11px/1 ui-sans-serif, Arial, sans-serif; fill: var(--muted); }
    .flow      { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .flow-back { stroke: var(--accent); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#ab); }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa3ae"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f6d8c"/>
    </marker>
  </defs>

  <text class="caption" x="24" y="24">MooPin — layout pipeline</text>

  <!-- ============ BAND 1 ============ -->
  <text class="bandlabel" x="24" y="60">1 · Initialisation — once per instance</text>
  <rect class="band" x="24" y="70" width="832" height="96"/>

  <rect class="box" x="44" y="94" width="176" height="50"/>
  <text class="t" x="132" y="116" text-anchor="middle">Instantiate</text>
  <text class="c" x="132" y="132" text-anchor="middle">new MooPin({...})</text>

  <rect class="box" x="248" y="94" width="176" height="50"/>
  <text class="t" x="336" y="116" text-anchor="middle">Merge options</text>
  <text class="c" x="336" y="132" text-anchor="middle">gutter, margin, resize</text>

  <rect class="box" x="452" y="94" width="176" height="50"/>
  <text class="t" x="540" y="116" text-anchor="middle">Bind resize</text>
  <text class="c" x="540" y="132" text-anchor="middle">if autoResize</text>

  <rect class="box" x="656" y="94" width="176" height="50"/>
  <text class="t" x="744" y="116" text-anchor="middle">First layout</text>
  <text class="c" x="744" y="132" text-anchor="middle">render()</text>

  <path class="flow" d="M220 119 H244"/>
  <path class="flow" d="M424 119 H448"/>
  <path class="flow" d="M628 119 H652"/>

  <!-- ============ BAND 2 ============ -->
  <text class="bandlabel" x="24" y="204">2 · Layout pass — render(), idempotent</text>
  <rect class="band" x="24" y="214" width="832" height="300"/>

  <rect class="box" x="44" y="238" width="248" height="50"/>
  <text class="t" x="168" y="260" text-anchor="middle">Measure</text>
  <text class="c" x="168" y="276" text-anchor="middle">first .item width, .tiles width</text>

  <rect class="box" x="316" y="238" width="248" height="50"/>
  <text class="t" x="440" y="260" text-anchor="middle">Derive column count</text>
  <text class="c" x="440" y="276" text-anchor="middle">width / (itemW + gutter)</text>

  <rect class="box" x="588" y="238" width="248" height="50"/>
  <text class="t" x="712" y="260" text-anchor="middle">Zero the height array</text>
  <text class="c" x="712" y="276" text-anchor="middle">one running total per column</text>

  <path class="flow" d="M292 263 H312"/>
  <path class="flow" d="M564 263 H584"/>

  <!-- per-item loop -->
  <rect class="loop" x="44" y="310" width="792" height="128"/>
  <text class="looplabel" x="60" y="329">FOR EACH .item, IN DOM ORDER</text>

  <rect class="box-key" x="60" y="342" width="236" height="56"/>
  <text class="t-key" x="178" y="366" text-anchor="middle">Pick shortest column</text>
  <text class="c" x="178" y="382" text-anchor="middle">min(heights) → index c</text>

  <rect class="box" x="322" y="342" width="236" height="56"/>
  <text class="t" x="440" y="366" text-anchor="middle">Place absolutely</text>
  <text class="c" x="440" y="382" text-anchor="middle">top = heights[c]</text>

  <rect class="box" x="584" y="342" width="236" height="56"/>
  <text class="t" x="702" y="366" text-anchor="middle">Add to that column</text>
  <text class="c" x="702" y="382" text-anchor="middle">heights[c] += h + margin</text>

  <path class="flow" d="M296 370 H318"/>
  <path class="flow" d="M558 370 H580"/>
  <path class="flow" d="M820 370 H832 V416 H60 V398"/>

  <path class="flow" d="M440 438 V456"/>
  <rect class="box" x="330" y="458" width="220" height="42"/>
  <text class="t" x="440" y="479" text-anchor="middle">fireEvent('render')</text>
  <text class="c" x="440" y="493" text-anchor="middle"> </text>

  <!-- ============ BAND 3 ============ -->
  <text class="bandlabel" x="24" y="560">3 · Re-entry — nothing incremental, just call render() again</text>
  <rect class="band" x="24" y="570" width="832" height="82"/>

  <rect class="box" x="44" y="592" width="380" height="46"/>
  <text class="t" x="234" y="612" text-anchor="middle">Window resized</text>
  <text class="c" x="234" y="628" text-anchor="middle">plugin re-runs the whole pass</text>

  <rect class="box" x="452" y="592" width="380" height="46"/>
  <text class="t" x="642" y="612" text-anchor="middle">Host page appends tiles</text>
  <text class="c" x="642" y="628" text-anchor="middle">infinite scroll calls render()</text>

  <path class="flow-back" d="M234 590 V520"/>
  <path class="flow-back" d="M642 590 V520"/>
  <text class="note" x="440" y="540" text-anchor="middle">re-enters the layout pass</text>

  <!-- ============ LEGEND ============ -->
  <rect x="24" y="672" width="14" height="10" rx="2" fill="none" stroke="#0f6d8c" stroke-width="2.25"/>
  <text class="note" x="46" y="681">the one interesting decision</text>

  <rect x="230" y="672" width="14" height="10" rx="2" fill="none" stroke="#9aa3ae" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text class="note" x="252" y="681">repeats per tile</text>

  <path d="M400 677 H424" stroke="#9aa3ae" stroke-width="1.5" marker-end="url(#a)"/>
  <text class="note" x="432" y="681">control flow</text>

  <path d="M540 677 H564" stroke="#0f6d8c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ab)"/>
  <text class="note" x="572" y="681">re-layout trigger</text>
</svg>
