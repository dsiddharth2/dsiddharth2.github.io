<svg viewBox="0 0 1200 880" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Multi-Agent Conversational AI system architecture: chat client, web auth tier, supervisor routing to five specialist agents, tool layer, and storage.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F5666"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6F8B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" fill="#FFFFFF"/>

  <!-- title -->
  <text x="40" y="34" font-size="15" font-weight="600" fill="#14202B">Conversational operations assistant — system architecture</text>

  <!-- ===== BAND 1: CLIENT ===== -->
  <rect x="40" y="56" width="1020" height="96" rx="6" fill="#F7F9FA" stroke="#E3E9ED"/>
  <text x="58" y="78" font-size="10" font-weight="700" letter-spacing="1.4" fill="#6B7F8D">CLIENT</text>

  <rect x="64" y="90" width="230" height="48" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="179" y="110" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Chat SPA</text>
  <text x="179" y="126" font-size="9.5" fill="#6B7F8D" text-anchor="middle">input, reasoning trace, citations</text>

  <rect x="790" y="90" width="254" height="48" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="917" y="110" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Streaming session</text>
  <text x="917" y="126" font-size="9.5" fill="#6B7F8D" text-anchor="middle">outlives navigation and unmount</text>

  <!-- ===== BAND 2: WEB / AUTH ===== -->
  <rect x="40" y="168" width="1020" height="96" rx="6" fill="#F7F9FA" stroke="#E3E9ED"/>
  <text x="58" y="190" font-size="10" font-weight="700" letter-spacing="1.4" fill="#6B7F8D">WEB AND AUTH TIER</text>

  <rect x="64" y="202" width="200" height="48" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="164" y="222" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Identity</text>
  <text x="164" y="238" font-size="9.5" fill="#6B7F8D" text-anchor="middle">bearer token to person</text>

  <rect x="284" y="202" width="240" height="48" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <rect x="284" y="202" width="3" height="48" fill="#1F6F8B"/>
  <text x="404" y="222" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Scope and permission filter</text>
  <text x="404" y="238" font-size="9.5" fill="#6B7F8D" text-anchor="middle">site / tenant scope resolved here</text>

  <rect x="544" y="202" width="200" height="48" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="644" y="222" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Cancellation record</text>
  <text x="644" y="238" font-size="9.5" fill="#6B7F8D" text-anchor="middle">flag row written</text>

  <line x1="164" y1="138" x2="164" y2="198" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="174" y="164" font-size="9.5" fill="#6B7F8D">question</text>

  <!-- ===== BAND 3: AGENT TIER ===== -->
  <rect x="40" y="280" width="1020" height="180" rx="6" fill="#F7F9FA" stroke="#E3E9ED"/>
  <text x="58" y="302" font-size="10" font-weight="700" letter-spacing="1.4" fill="#6B7F8D">AGENT TIER</text>

  <line x1="404" y1="250" x2="404" y2="312" stroke="#1F6F8B" stroke-width="1.4" marker-end="url(#arrowAccent)"/>
  <text x="414" y="270" font-size="9.5" font-weight="600" fill="#1F6F8B">dispatch, no response awaited</text>

  <rect x="64" y="316" width="240" height="128" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <rect x="64" y="316" width="3" height="128" fill="#1F6F8B"/>
  <text x="184" y="338" font-size="12" font-weight="600" fill="#14202B" text-anchor="middle">Supervisor</text>
  <text x="184" y="358" font-size="9.5" fill="#6B7F8D" text-anchor="middle">greeting fast path</text>
  <text x="184" y="374" font-size="9.5" fill="#6B7F8D" text-anchor="middle">three classifiers in parallel:</text>
  <text x="184" y="390" font-size="9.5" fill="#3F5666" text-anchor="middle">depth · cost tier · owning agent</text>
  <text x="184" y="410" font-size="9.5" fill="#6B7F8D" text-anchor="middle">resolves model matrix,</text>
  <text x="184" y="426" font-size="9.5" fill="#6B7F8D" text-anchor="middle">then hands off</text>

  <line x1="304" y1="380" x2="336" y2="380" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="340" y="316" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="356" y="333" font-size="11.5" font-weight="600" fill="#14202B">Infrastructure and devices</text>
  <text x="356" y="347" font-size="9.5" fill="#6B7F8D">controllers, readers, cameras, doors</text>

  <rect x="340" y="362" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="356" y="379" font-size="11.5" font-weight="600" fill="#14202B">Knowledge and documentation</text>
  <text x="356" y="393" font-size="9.5" fill="#6B7F8D">policies, how-to guides, site docs</text>

  <rect x="340" y="408" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="356" y="425" font-size="11.5" font-weight="600" fill="#14202B">Reporting</text>
  <text x="356" y="439" font-size="9.5" fill="#6B7F8D">100+ report types, parameters from text</text>

  <rect x="690" y="316" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="706" y="333" font-size="11.5" font-weight="600" fill="#14202B">People and access</text>
  <text x="706" y="347" font-size="9.5" fill="#6B7F8D">identity, roles, access levels</text>

  <rect x="690" y="362" width="330" height="38" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="706" y="379" font-size="11.5" font-weight="600" fill="#14202B">Support tickets</text>
  <text x="706" y="393" font-size="9.5" fill="#6B7F8D">ticket history joined with knowledge</text>

  <rect x="690" y="408" width="330" height="38" rx="4" fill="#FDFEFE" stroke="#C7D2D9" stroke-dasharray="3 3"/>
  <text x="706" y="425" font-size="11.5" font-weight="600" fill="#3F5666">Registry-driven</text>
  <text x="706" y="439" font-size="9.5" fill="#6B7F8D">a new agent rewrites the routing prompt</text>

  <!-- ===== BAND 4: TOOLS ===== -->
  <rect x="40" y="476" width="1020" height="140" rx="6" fill="#F7F9FA" stroke="#E3E9ED"/>
  <text x="58" y="498" font-size="10" font-weight="700" letter-spacing="1.4" fill="#6B7F8D">TOOL LAYER</text>

  <line x1="505" y1="446" x2="505" y2="504" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="515" y="470" font-size="9.5" fill="#6B7F8D">tool calls, looped until done</text>

  <rect x="64" y="508" width="310" height="96" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="80" y="527" font-size="11.5" font-weight="600" fill="#14202B">Query tools</text>
  <text x="80" y="545" font-size="9.5" fill="#6B7F8D">1. schema description into prompt</text>
  <text x="80" y="560" font-size="9.5" fill="#6B7F8D">2. model drafts SQL</text>
  <text x="80" y="575" font-size="9.5" fill="#6B7F8D">3. read-only validation</text>
  <text x="80" y="590" font-size="9.5" font-weight="600" fill="#1F6F8B">4. permission clauses injected</text>

  <rect x="391" y="508" width="310" height="96" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="407" y="527" font-size="11.5" font-weight="600" fill="#14202B">Retrieval tools</text>
  <text x="407" y="545" font-size="9.5" fill="#6B7F8D">1. embed the question</text>
  <text x="407" y="560" font-size="9.5" fill="#6B7F8D">2. seven collections searched at once</text>
  <text x="407" y="575" font-size="9.5" fill="#6B7F8D">3. merge, dedupe, rank</text>
  <text x="407" y="590" font-size="9.5" fill="#6B7F8D">4. synthesise, keep source manifest</text>

  <rect x="718" y="508" width="310" height="96" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="734" y="527" font-size="11.5" font-weight="600" fill="#14202B">Report tools</text>
  <text x="734" y="545" font-size="9.5" fill="#6B7F8D">1. dates and filters parsed from text</text>
  <text x="734" y="560" font-size="9.5" fill="#6B7F8D">2. request built per report type</text>
  <text x="734" y="575" font-size="9.5" fill="#6B7F8D">3. file fetched and parsed</text>
  <text x="734" y="590" font-size="9.5" fill="#6B7F8D">4. summary plus download link</text>

  <!-- ===== BAND 5: STORAGE ===== -->
  <rect x="40" y="632" width="1020" height="124" rx="6" fill="#F7F9FA" stroke="#E3E9ED"/>
  <text x="58" y="654" font-size="10" font-weight="700" letter-spacing="1.4" fill="#6B7F8D">STORAGE AND SERVICES</text>

  <rect x="64" y="666" width="184" height="76" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="156" y="686" font-size="11.5" font-weight="600" fill="#14202B" text-anchor="middle">Relational store</text>
  <text x="156" y="703" font-size="9.5" fill="#6B7F8D" text-anchor="middle">devices, people, access</text>
  <text x="156" y="717" font-size="9.5" fill="#6B7F8D" text-anchor="middle">records, tickets</text>
  <text x="156" y="733" font-size="9.5" fill="#3F5666" text-anchor="middle">read-only, pooled</text>

  <rect x="262" y="666" width="184" height="76" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="354" y="686" font-size="11.5" font-weight="600" fill="#14202B" text-anchor="middle">Graph plus vector</text>
  <text x="354" y="703" font-size="9.5" fill="#6B7F8D" text-anchor="middle">chunks, entities, relations,</text>
  <text x="354" y="717" font-size="9.5" fill="#6B7F8D" text-anchor="middle">topics, community summaries</text>
  <text x="354" y="733" font-size="9.5" fill="#3F5666" text-anchor="middle">7 collections</text>

  <rect x="460" y="666" width="184" height="76" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="552" y="686" font-size="11.5" font-weight="600" fill="#14202B" text-anchor="middle">Reporting service</text>
  <text x="552" y="703" font-size="9.5" fill="#6B7F8D" text-anchor="middle">existing platform API</text>
  <text x="552" y="717" font-size="9.5" fill="#6B7F8D" text-anchor="middle">100+ report types</text>

  <rect x="658" y="666" width="184" height="76" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="750" y="686" font-size="11.5" font-weight="600" fill="#14202B" text-anchor="middle">Object store and lake</text>
  <text x="750" y="703" font-size="9.5" fill="#6B7F8D" text-anchor="middle">attachments, report files,</text>
  <text x="750" y="717" font-size="9.5" fill="#6B7F8D" text-anchor="middle">rolling chat summaries</text>

  <rect x="856" y="666" width="184" height="76" rx="4" fill="#FFFFFF" stroke="#C7D2D9"/>
  <text x="948" y="686" font-size="11.5" font-weight="600" fill="#14202B" text-anchor="middle">Cancellation table</text>
  <text x="948" y="703" font-size="9.5" fill="#6B7F8D" text-anchor="middle">written by web tier,</text>
  <text x="948" y="717" font-size="9.5" fill="#6B7F8D" text-anchor="middle">polled at agent checkpoints</text>

  <polyline points="219,604 219,626 156,626 156,662" fill="none" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polyline points="546,604 546,640 354,640 354,662" fill="none" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polyline points="873,604 873,632 750,632 750,662" fill="none" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <polyline points="873,604 873,632 552,632 552,662" fill="none" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ===== RETURN STREAM ===== -->
  <polyline points="1044,392 1120,392 1120,114 1050,114" fill="none" stroke="#1F6F8B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="1112" y="270" font-size="10" font-weight="600" fill="#1F6F8B" text-anchor="middle" transform="rotate(-90 1112 270)">streamed back, two channels</text>
  <text x="1128" y="270" font-size="9.5" fill="#6B7F8D" text-anchor="middle" transform="rotate(-90 1128 270)">answer text · citations</text>

  <!-- ===== LEGEND ===== -->
  <line x1="64" y1="800" x2="104" y2="800" stroke="#3F5666" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="114" y="804" font-size="10" fill="#3F5666">request path, synchronous</text>

  <line x1="320" y1="800" x2="360" y2="800" stroke="#1F6F8B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowAccent)"/>
  <text x="370" y="804" font-size="10" fill="#3F5666">response path, streamed</text>

  <rect x="576" y="792" width="3" height="16" fill="#1F6F8B"/>
  <text x="588" y="804" font-size="10" fill="#3F5666">authorisation or routing decision point</text>

  <text x="880" y="804" font-size="10" fill="#6B7F8D">boxes are components; bands are tiers</text>
</svg>
